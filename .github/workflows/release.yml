name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version / tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install llvm and lld
        run: sudo apt-get update && sudo apt-get install -y llvm lld

      - name: fetch openorbis toolchain
        run: |
          curl -sL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar xz -C "$HOME"
          echo "OO_PS4_TOOLCHAIN=$HOME/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

      - name: build and install goldhen sdk
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git
          make -C GoldHEN_Plugins_SDK
          make -C GoldHEN_Plugins_SDK install
          cp GoldHEN_Plugins_SDK/build/crtprx.o "$OO_PS4_TOOLCHAIN/lib/crtprx.o"

      - name: build plugin
        run: |
          make
          cp cowboy_menu.prx "cowboy_menu-${{ inputs.version }}.prx"

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" "cowboy_menu-${{ inputs.version }}.prx" \
            --repo "${{ github.repository }}" \
            --title "cowboy menu ${{ inputs.version }}" \
            --notes "RDR2 PS4 mod menu (CUSA08519, game 1.32). Open with R1 + O. Drop the prx in /data/GoldHEN/plugins/ and add it under [CUSA08519] in plugins.ini."